<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f4f7f5">
<title>计划平台</title>
<style>
/* ========== Reset ========== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.overlay-open{overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
input[type=text],input[type=date],input[type=time],input[type=number],textarea{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;color:var(--text);width:100%}
input[type=text]::placeholder,input[type=date]::placeholder{color:var(--text-4)}
input:focus,textarea:focus{border-color:var(--accent)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 75%,white);outline-offset:3px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-light)}

/* ========== Variables ========== */
:root{
--bg:#f4f7f5;--bg-1:#ffffff;--bg-2:#eef3f0;--bg-3:#e3ebe7;--bg-4:#d9e4df;
--border:#d4ded8;--border-l:#c0d0c8;
--primary:#2d6a4f;--primary-l:#40916c;--accent:#52b788;--accent-2:#74c69d;
--text:#1a2e26;--text-2:#4a6055;--text-3:#7a8a83;--text-4:#a8b5b0;
--danger:#e76f51;--danger-l:#d4573a;--warning:#d4a017;--success:#3a9d6d;
--type-work:#6b7c72;--type-study:#2d9d6f;--type-exercise:#d4503a;--type-ip:#9333ea;
--r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--t:.25s ease;
--sidebar-w:220px;--tabbar-h:56px;
}

/* ========== Layout ========== */
#app{display:flex;min-height:100vh}
#sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--bg-1);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;z-index:100}
#main{flex:1;margin-left:var(--sidebar-w);min-width:0;padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom))}
#content{max-width:960px;margin:0 auto;padding:0 24px 40px}

/* ========== Sidebar ========== */
.sidebar-logo{padding:0 24px 20px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-size:18px;font-weight:600;letter-spacing:.5px;color:var(--text)}
.sidebar-logo p{font-size:11px;color:var(--text-3);margin-top:2px}
.sidebar-nav{flex:1;padding:16px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 24px;color:var(--text-2);font-size:14px;transition:var(--t);border-left:3px solid transparent;cursor:pointer}
.nav-item:hover{color:var(--text);background:var(--bg-2)}
.nav-item.active{color:var(--primary);border-left-color:var(--accent);background:rgba(82,183,136,.1)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.sidebar-footer{padding:16px 24px;border-top:1px solid var(--border)}
.legend{display:flex;flex-direction:column;gap:6px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ========== Topbar ========== */
#topbar{position:sticky;top:0;background:rgba(244,247,245,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:50}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-date{font-size:13px;color:var(--text-2)}
.topbar-date .today-num{color:var(--accent);font-weight:600}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-sm);font-size:13px;transition:var(--t);white-space:nowrap}
.btn svg{width:14px;height:14px}
.btn-ghost{color:var(--text-2);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border-l);background:var(--bg-2)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-l)}
.btn-danger{color:var(--danger);border:1px solid rgba(231,111,81,.3)}
.btn-danger:hover{background:rgba(231,111,81,.1)}
.btn-sm{padding:5px 10px;font-size:12px}
<omitted />

/* ========== Quote ========== */
.daily-quote{text-align:center;padding:12px 16px;margin-bottom:20px;font-size:13px;color:var(--text-3);font-style:italic;letter-spacing:.5px}
.daily-quote::before,.daily-quote::after{content:'"';color:var(--text-4)}

/* ========== Sections ========== */
.section{display:none}
.section.active{display:block}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.section-title{font-size:20px;font-weight:600;letter-spacing:.5px}
.section-sub{font-size:13px;color:var(--text-3);margin-top:2px}

/* ========== Today ========== */
.today-banner{background:linear-gradient(135deg,var(--bg-2),var(--bg-3));border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:20px}
.today-banner.overdue-banner{border-color:rgba(231,111,81,.3);background:linear-gradient(135deg,rgba(231,111,81,.06),var(--bg-2))}
.today-banner-title{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;margin-bottom:10px}
.today-banner-title svg{width:15px;height:15px;flex-shrink:0;opacity:.7}
.today-banner-title .count{font-size:12px;color:var(--text-3);font-weight:400}
.overdue-banner .today-banner-title{color:var(--danger-l)}
.today-list{display:flex;flex-direction:column;gap:6px}
.today-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-2);border-radius:var(--r-sm);border-left:3px solid;transition:var(--t)}
.today-item:hover{background:var(--bg-3)}
.today-item.overdue{border-left-color:var(--danger)}
.today-item.today{border-left-color:var(--accent)}
.today-item.upcoming{border-left-color:var(--warning)}
.today-item-done{text-decoration:line-through;opacity:.4}
.today-item-day{font-size:11px;color:var(--text-3);white-space:nowrap;min-width:48px}
.today-item-text{flex:1;font-size:14px}
.today-item-type{font-size:10px;padding:2px 6px;border-radius:3px;white-space:nowrap}
.today-quick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-l);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--t);cursor:pointer}
.today-quick:hover{border-color:var(--accent)}
.today-quick.done{background:var(--accent);border-color:var(--accent)}
.today-quick.done svg{display:block}
.today-quick svg{display:none;width:12px;height:12px;color:#fff}
.today-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;text-align:center}
.stat-num{font-size:24px;font-weight:700;color:var(--accent)}
.stat-label{font-size:11px;color:var(--text-3);margin-top:4px}
.stat-card.danger .stat-num{color:var(--danger-l)}
.stat-card.warning .stat-num{color:var(--warning)}

/* ========== Weekly ========== */
.week-nav-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.week-nav-btn{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;transition:var(--t);color:var(--text-2)}
.week-nav-btn:hover{border-color:var(--border-l);color:var(--text);background:var(--bg-2)}
.week-nav-btn svg{width:14px;height:14px}
.week-title{font-size:15px;font-weight:600;min-width:180px;text-align:center}
.week-progress-wrap{flex:1;min-width:120px}
.week-progress-bar{height:6px;background:var(--bg-2);border-radius:3px;overflow:hidden;margin-top:4px}
.week-progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:3px;transition:width .4s ease}
.week-progress-text{font-size:11px;color:var(--text-3)}
.sunday-alert{background:linear-gradient(135deg,rgba(82,183,136,.08),var(--bg-2));border:1px solid rgba(82,183,136,.25);border-radius:var(--r-md);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sunday-alert-text{font-size:13px;color:var(--text-2)}
.sunday-alert-text strong{color:var(--accent)}
.week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.day-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.day-card.today-card{border-color:var(--accent);box-shadow:0 0 0 1px rgba(82,183,136,.15)}
.day-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--bg-2)}
.day-name{font-size:14px;font-weight:600}
.day-date{font-size:12px;color:var(--text-3)}
.day-count{font-size:11px;color:var(--text-3);background:var(--bg-3);padding:2px 8px;border-radius:10px}
.day-tasks{padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-height:40px}
.task{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:var(--r-sm);border-left:3px solid;transition:var(--t);position:relative}
.task:hover{background:var(--bg-2)}
.task:hover .task-del{opacity:1}
.task.done .task-text{text-decoration:line-through;color:var(--text-4)}
.task-check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border-l);flex-shrink:0;margin-top:1px;cursor:pointer;transition:var(--t);display:flex;align-items:center;justify-content:center}
.task-check:hover{border-color:var(--accent)}
.task-check.checked{background:var(--accent);border-color:var(--accent)}
.task-check svg{display:none;width:11px;height:11px;color:#fff}
.task-check.checked svg{display:block}
.task-body{flex:1;min-width:0}
.task-text{font-size:13px;line-height:1.5;word-break:break-word;cursor:text}
.task-text[contenteditable=true]:focus{outline:none;background:var(--bg-3);border-radius:3px;padding:0 4px}
.goal-text[contenteditable=true]:focus,.board-mindset[contenteditable=true]:focus,.board-method[contenteditable=true]:focus,.board-name[contenteditable=true]:focus,.case-name[contenteditable=true]:focus,.case-note[contenteditable=true]:focus,.strat-text[contenteditable=true]:focus,.topic-text[contenteditable=true]:focus,.goal-count[contenteditable=true]:focus{outline:none;background:var(--bg-3);border-radius:3px;padding:0 3px}
.task-time{font-size:11px;color:var(--text-3);margin-left:4px;cursor:text}
.task-time[contenteditable=true]:focus{outline:none;background:var(--bg-3);border-radius:2px;padding:0 2px}
.task-important .task-text{font-weight:600}
.task-star{width:16px;height:16px;flex-shrink:0;cursor:pointer;color:var(--text-4);transition:var(--t);display:flex;align-items:center}
.task-star.active{color:#d4a017}
.task-star svg{width:14px;height:14px}
.task-grip{width:12px;height:16px;flex-shrink:0;cursor:grab;color:var(--text-4);display:flex;align-items:center;opacity:.5;transition:opacity .15s}
.task-grip svg{width:12px;height:16px;display:block}
.task:hover .task-grip{opacity:1}
.task.dragging{opacity:.4}
.task.drag-over{border-top:2px solid var(--accent)}
.task-type-tag{font-size:10px;padding:1px 5px;border-radius:3px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.task-del{opacity:0;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--text-4);transition:var(--t);flex-shrink:0;cursor:pointer}
.task-del:hover{color:var(--danger);background:rgba(231,111,81,.1)}
.task-del svg{width:12px;height:12px}
.task-add-row{padding:8px 10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.task-add-input{font-size:13px;padding:6px 10px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-sm)}
.task-add-bottom{display:flex;align-items:center;gap:6px;justify-content:space-between}
.type-select{font-size:12px;padding:4px 8px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text-2);cursor:pointer;flex-shrink:0}
.type-select:focus{border-color:var(--accent)}
.task-add-btn{width:28px;height:28px;border-radius:var(--r-sm);background:var(--primary);display:flex;align-items:center;justify-content:center;transition:var(--t)}
.task-add-btn:hover{background:var(--primary-l)}
.task-add-btn svg{width:14px;height:14px;color:var(--text)}
.task-add-time{width:60px;font-size:11px;padding:3px 6px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text-2)}
.day-empty{text-align:center;padding:16px;font-size:12px;color:var(--text-4)}
.insp-list{display:flex;flex-direction:column;gap:6px}
.insp-item{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;background:var(--bg-2);border-radius:var(--r-sm);border-left:3px solid var(--accent);transition:var(--t)}
.insp-item:hover{background:var(--bg-3)}
.insp-text{flex:1;font-size:13px;line-height:1.5;word-break:break-word;cursor:text}
.insp-text[contenteditable=true]:focus{outline:none;background:var(--bg-3);border-radius:3px;padding:0 4px}
.insp-time{font-size:10px;color:var(--text-4);flex-shrink:0;margin-top:2px}
.insp-actions{display:flex;gap:4px;flex-shrink:0;opacity:0;transition:var(--t)}
.insp-item:hover .insp-actions{opacity:1}
.insp-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;border:1px solid var(--border);color:var(--text-3);cursor:pointer;transition:var(--t);font-size:11px}
.insp-btn:hover{border-color:var(--accent);color:var(--accent)}
.insp-btn.del:hover{border-color:var(--danger);color:var(--danger)}
.insp-btn svg{width:12px;height:12px}
.insp-add{display:flex;gap:6px;margin-top:8px}
.insp-add-input{flex:1;font-size:13px;padding:6px 10px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-sm)}
.insp-add-input:focus{border-color:var(--accent);outline:none}

/* ========== Monthly ========== */
.monthly-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.board-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;position:relative;overflow:hidden}
.board-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--board-color,var(--accent))}
.board-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.board-icon{width:32px;height:32px;border-radius:var(--r-sm);background:var(--bg-3);display:flex;align-items:center;justify-content:center}
.board-icon svg{width:18px;height:18px}
.board-name{font-size:16px;font-weight:600}
.board-mindset{font-size:12px;color:var(--text-3);font-style:italic;margin-bottom:14px;padding:8px 12px;background:var(--bg-2);border-radius:var(--r-sm);border-left:2px solid var(--border-l)}
.board-goals{display:flex;flex-direction:column;gap:8px}
.goal-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);transition:var(--t)}
.goal-row:hover{background:var(--bg-2)}
.goal-row.drag-over{border-top:2px solid var(--accent)}
.goal-row.dragging{opacity:.4}
.goal-del{opacity:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:3px;color:var(--text-4);transition:var(--t);flex-shrink:0;cursor:pointer}
.goal-row:hover .goal-del{opacity:1}
.goal-del:hover{color:var(--danger);background:rgba(231,111,81,.1)}
.goal-del svg{width:11px;height:11px}
.goal-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-l);flex-shrink:0;cursor:pointer;transition:var(--t);display:flex;align-items:center;justify-content:center}
.goal-check:hover{border-color:var(--accent)}
.goal-check.checked{background:var(--accent);border-color:var(--accent)}
.goal-check svg{display:none;width:11px;height:11px;color:#fff}
.goal-check.checked svg{display:block}
.goal-text{flex:1;min-width:0;font-size:13px;line-height:1.4}
.goal-text.done{text-decoration:line-through;color:var(--text-4)}
.goal-progress{display:flex;align-items:center;gap:2px;font-size:11px;color:var(--text-2);flex-shrink:0}
.goal-ctrl{width:18px;height:18px;border-radius:3px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-2);transition:var(--t);cursor:pointer;flex-shrink:0}
.goal-ctrl:hover{border-color:var(--accent);color:var(--accent)}
.goal-bar{width:30px;height:4px;background:var(--bg-3);border-radius:2px;overflow:hidden;flex-shrink:0}
.goal-bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease}
.goal-add{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.goal-add-input{flex:1;min-width:0;font-size:12px;padding:5px 8px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text-2)}
.goal-add-input:focus{border-color:var(--accent);outline:none}
.goal-add-btn{width:24px;height:24px;border-radius:var(--r-sm);background:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--t);flex-shrink:0}
.goal-add-btn:hover{background:var(--primary-l)}
.goal-add-btn svg{width:12px;height:12px;color:var(--text)}
.board-method{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);line-height:1.6}
.board-method strong{color:var(--text-2)}

/* ========== Cases ========== */
.case-section{margin-bottom:24px}
.case-section-title{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.case-section-title svg{width:15px;height:15px;flex-shrink:0;opacity:.7}
.case-section-title .count{font-size:12px;color:var(--text-3);font-weight:400}
.case-list{display:flex;flex-direction:column;gap:10px}
.case-card{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--r-md);transition:var(--t)}
.case-card:hover{border-color:var(--border-l);background:var(--bg-2)}
.case-card.overdue{border-color:rgba(231,111,81,.35);background:linear-gradient(90deg,rgba(231,111,81,.04),var(--bg-1))}
.case-card.urgent{border-color:rgba(233,180,76,.3)}
.case-card.done{opacity:.5}
.case-info{flex:1;min-width:0}
.case-name{font-size:14px;font-weight:500}
.case-note{font-size:12px;color:var(--text-3);margin-top:2px}
.case-date{font-size:12px;color:var(--text-2);margin-top:2px}
.case-countdown{text-align:right;flex-shrink:0;min-width:80px}
.countdown-num{font-size:20px;font-weight:700}
.countdown-label{font-size:11px;color:var(--text-3)}
.case-card.overdue .countdown-num{color:var(--danger-l)}
.case-card.urgent .countdown-num{color:var(--warning)}
.case-card:not(.overdue):not(.urgent) .countdown-num{color:var(--accent)}
.case-del{opacity:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--text-4);transition:var(--t);cursor:pointer;flex-shrink:0}
.case-card:hover .case-del{opacity:1}
.case-del:hover{color:var(--danger);background:rgba(231,111,81,.1)}
.case-del svg{width:14px;height:14px}
.case-add-form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:16px;align-items:end}
.case-add-form input,.case-add-form select{padding:8px 10px;font-size:13px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-sm)}

/* ========== Strategy ========== */
.strat-block{margin-bottom:28px}
.strat-block-title{font-size:15px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.strat-list{display:flex;flex-direction:column;gap:6px}
.strat-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-2);border-radius:var(--r-sm);transition:var(--t)}
.strat-item:hover{background:var(--bg-3)}
.strat-item.done .strat-text{text-decoration:line-through;color:var(--text-4)}
.strat-text{flex:1;font-size:13px}
.strat-add{display:flex;gap:8px;margin-top:8px}
.strat-add input{flex:1}
.topic-list{display:flex;flex-direction:column;gap:8px}
.topic-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-2);border-radius:var(--r-sm);border-left:3px solid;transition:var(--t)}
.topic-item:hover{background:var(--bg-3)}
.topic-text{flex:1;font-size:13px}
.topic-status{font-size:11px;padding:2px 8px;border-radius:10px;cursor:pointer;transition:var(--t)}
.topic-status.idea{background:rgba(74,96,85,.12);color:var(--text-2)}
.topic-status.writing{background:rgba(212,160,23,.15);color:var(--warning)}
.topic-status.published{background:rgba(58,157,109,.15);color:var(--success)}
.topic-del{opacity:0;color:var(--text-4);cursor:pointer;transition:var(--t)}
.strat-del{opacity:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:3px;color:var(--text-4);transition:var(--t);flex-shrink:0;cursor:pointer}
.strat-item:hover .strat-del{opacity:1}
.strat-del:hover{color:var(--danger);background:rgba(231,111,81,.1)}
.strat-del svg{width:11px;height:11px}
.strat-item.drag-over,.topic-item.drag-over{border-top:2px solid var(--accent)}
.strat-item.dragging,.topic-item.dragging{opacity:.4}
.topic-item:hover .topic-del{opacity:1}
.topic-del:hover{color:var(--danger)}

/* ========== Modal ========== */
#modal-root{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;overscroll-behavior:contain}
#modal-root.show{display:flex}
.modal-box{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:600;margin-bottom:12px}
.modal-body{font-size:14px;color:var(--text-2);line-height:1.6;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.modal-preview{background:var(--bg-2);border-radius:var(--r-md);padding:16px;margin:12px 0;max-height:300px;overflow-y:auto}
.modal-preview-day{font-size:13px;font-weight:600;color:var(--accent);margin:10px 0 4px}
.modal-preview-day:first-child{margin-top:0}
.modal-preview-task{font-size:12px;color:var(--text-2);padding:3px 0 3px 12px;border-left:2px solid var(--border);margin-bottom:2px}
.mp-task-text{cursor:text}
.mp-task-text:focus{outline:none;background:var(--bg-3);border-radius:2px;padding:0 2px}
.mp-task-time{font-size:10px;color:var(--text-3);margin-left:4px;cursor:text}
.mp-task-time:focus{outline:none;background:var(--bg-3);border-radius:2px;padding:0 2px}

/* ========== Toast ========== */
#toast-root{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg-1);border:1px solid var(--border-l);border-radius:var(--r-md);padding:10px 16px;font-size:13px;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.12);animation:toastIn .3s ease;max-width:320px}
.toast.success{border-color:rgba(82,183,136,.3)}
.toast.error{border-color:rgba(231,111,81,.3)}
.toast.warning{border-color:rgba(233,180,76,.3)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ========== Backup Banner ========== */
.backup-banner{background:linear-gradient(135deg,rgba(233,180,76,.08),var(--bg-2));border:1px solid rgba(233,180,76,.25);border-radius:var(--r-md);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.backup-banner-text{font-size:13px;color:var(--text-2)}
.backup-banner-text strong{color:var(--warning)}

/* ========== Empty State ========== */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-4)}
.empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:.3}
.empty-state p{font-size:14px;margin-bottom:12px}

/* ========== Desktop Legend ========== */
.topbar-title{display:none;font-size:16px;font-weight:600;letter-spacing:.5px;color:var(--text)}
.desktop-legend{display:none}

/* ========== Dashboard (Desktop ≥769px) ========== */
@media(min-width:769px){
  #sidebar{display:none}
  #main{margin-left:0}
  #content{
    max-width:1000px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    align-items:start;
  }
  .topbar-title{display:inline-block;margin-right:12px}
  .desktop-legend{
    display:flex;
    gap:16px;
    justify-content:center;
    grid-column:1/-1;
    padding:4px 0;
    font-size:12px;
    color:var(--text-3);
  }
  .desktop-legend .legend-item{display:flex;align-items:center;gap:6px}
  .daily-quote{grid-column:1/-1;margin-bottom:0}
  #backup-banner-root{grid-column:1/-1}
  #backup-banner-root:empty{display:none}
  .section{
    display:block !important;
    background:var(--bg-1);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    padding:16px;
    margin:0;
  }
  .section-header{margin-bottom:12px}
  .section-title{font-size:15px}
  .section-sub{font-size:12px}
  #view-strategy{
    grid-column:1/-1;
    display:grid !important;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
  }
  #view-strategy .section-header{grid-column:1/-1}
  #view-strategy .strat-block{margin-bottom:0}
  #view-history{
    grid-column:1/-1;
  }
  .today-stats{gap:8px}
  .stat-card{padding:10px}
  .stat-num{font-size:18px}
  .monthly-grid{gap:10px;align-items:start}
  .board-card{padding:14px}
  .case-add-form{grid-template-columns:2fr 1fr 1fr;gap:6px}
  .case-add-form #case-note{display:none}
  .case-add-form button{grid-column:1/-1;justify-self:start;margin-top:2px}
  .week-grid{gap:8px}
  .week-nav-bar{flex-wrap:wrap}
  .board-goals{gap:4px}
  .goal-row{padding:6px 8px;gap:6px}
  .strat-item{padding:8px 12px}
}

/* ========== PC (≥1200px) ========== */
@media(min-width:1200px){
  #content{max-width:1400px;gap:16px}
  .section{padding:18px}
  .section-title{font-size:16px}
  .stat-num{font-size:20px}
  .monthly-grid{gap:12px;align-items:start}
  .board-card{padding:18px}
}

/* ========== Tabbar (mobile) ========== */
#tabbar{display:none}

/* ========== PIN Gate ========== */
#pin-gate{position:fixed;inset:0;background:var(--bg);z-index:999;display:none;align-items:center;justify-content:center}
#pin-gate.show{display:flex}
.pin-box{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--r-lg);padding:32px 36px;max-width:340px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.08)}
.pin-logo{font-size:20px;font-weight:600;margin-bottom:4px}
.pin-sub{font-size:13px;color:var(--text-3);margin-bottom:24px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:20px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border-l);transition:var(--t)}
.pin-dot.filled{background:var(--accent);border-color:var(--accent)}
.pin-error{color:var(--danger-l);font-size:13px;margin-bottom:8px;min-height:20px;opacity:0;transition:var(--t)}
.pin-error.show{opacity:1}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:220px;margin:0 auto}
.pin-key{height:48px;border:1px solid var(--border);border-radius:var(--r-md);font-size:20px;font-weight:500;transition:var(--t);background:var(--bg-2);color:var(--text)}
.pin-key:hover{background:var(--bg-3);border-color:var(--border-l)}
.pin-key:active{transform:scale(.95)}
.pin-key.action{font-size:13px;color:var(--text-2)}
.pin-hint{font-size:12px;color:var(--text-4);margin-top:16px}

/* ========== History Module ========== */
.hist-week-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hist-week-label{font-size:14px;font-weight:500;min-width:160px;text-align:center}
.hist-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.hist-stat{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.hist-stat-num{font-size:20px;font-weight:700}
.hist-stat-label{font-size:11px;color:var(--text-3);margin-top:2px}
.hist-day-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.hist-day-name{font-size:12px;font-weight:600;color:var(--text-2);min-width:60px;flex-shrink:0;padding-top:2px}
.hist-day-tasks{flex:1;display:flex;flex-direction:column;gap:4px}
.hist-task{font-size:12px;display:flex;align-items:center;gap:6px}
.hist-task.done{text-decoration:line-through;color:var(--text-4)}
.hist-task-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hist-ref{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;font-size:13px;line-height:1.8;color:var(--text-2);max-height:500px;overflow-y:auto}
.hist-ref h4{font-size:14px;font-weight:600;color:var(--text);margin:12px 0 6px}
.hist-ref h4:first-child{margin-top:0}
.hist-ref ul{padding-left:20px;margin:4px 0}
.hist-ref li{margin-bottom:2px}
.hist-empty{text-align:center;padding:30px 20px;color:var(--text-4);font-size:13px}

/* ========== Undo Toast ========== */
.toast.undo{display:flex;align-items:center;gap:12px;pointer-events:auto;cursor:default}
.toast-undo-btn{color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;border:none;background:none;padding:0}
.toast-undo-btn:hover{text-decoration:underline}

/* ========== Settings Button ========== */
.btn-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--text-2);transition:var(--t)}
.btn-icon:hover{background:var(--bg-2);color:var(--text)}
.sync-indicator{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-sm);font-size:12px;color:var(--text-3);border:1px solid var(--border);background:var(--bg-1);transition:var(--t);cursor:pointer;white-space:nowrap}
.sync-indicator:hover{background:var(--bg-2);border-color:var(--border-l)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text-4);flex-shrink:0;transition:var(--t)}
.sync-indicator.sync-local .sync-dot{background:var(--text-4)}
.sync-indicator.sync-connecting .sync-dot{background:var(--warning);animation:pulse 1s infinite}
.sync-indicator.sync-online .sync-dot{background:var(--success)}
.sync-indicator.sync-syncing .sync-dot{background:var(--warning);animation:pulse 1s infinite}
.sync-indicator.sync-synced .sync-dot{background:var(--success)}
.sync-indicator.sync-updated .sync-dot{background:var(--accent)}
.sync-indicator.sync-error .sync-dot{background:var(--danger)}
.sync-indicator.sync-error{color:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-config-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.sync-config-row label{font-size:12px;color:var(--text-3);font-weight:500}
.sync-config-row input{font-size:13px}
.sync-config-status{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg-2);border-radius:var(--r-sm);margin-bottom:14px}
.sync-config-hint{font-size:12px;color:var(--text-3);line-height:1.7;background:var(--bg-2);border-radius:var(--r-sm);padding:12px 14px;margin-top:8px}
.sync-config-hint code{background:var(--bg-3);padding:1px 5px;border-radius:3px;font-size:11px;color:var(--primary)}

/* ========== Responsive ========== */
@media(max-width:768px){
#sidebar{display:none}
#main{margin-left:0;padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 8px)}
#content{padding:0 14px 24px}
#topbar{padding:12px 14px}
.topbar-date{font-size:12px}
.topbar-right{gap:4px}
.btn{padding:6px 10px;font-size:12px}
.btn span.btn-label{display:none}
.monthly-grid{grid-template-columns:1fr}
.today-stats{grid-template-columns:1fr}
.case-add-form{grid-template-columns:1fr 1fr;gap:6px}
.week-grid{grid-template-columns:1fr}
.section-title{font-size:17px}
#tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));background:var(--bg-1);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:100}
.tabbar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-3);font-size:10px;transition:var(--t);padding-top:6px}
.tabbar-item.active{color:var(--accent)}
.tabbar-item svg{width:20px;height:20px}
#toast-root{bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 10px);left:14px;right:14px}
.toast{max-width:none}
.daily-quote{font-size:12px;padding:8px 12px;margin-bottom:14px}
}
@media(max-width:480px){
  #topbar{gap:8px}.topbar-left{min-width:0}.topbar-date{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:155px}
  .case-card{align-items:flex-start;gap:8px;padding:12px}.case-countdown{min-width:64px}.case-add-form{grid-template-columns:1fr}.case-add-form button{justify-self:start}
  .task-type-tag{display:none}.today-item{padding:10px}.today-item-type{display:none}.today-item-day{min-width:38px}
  .tabbar-item{min-width:44px}.tabbar-item span{font-size:9px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

/* ========== Utility ========== */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmtDate(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd}
function parseLocalDate(value){if(value instanceof Date)return new Date(value.getFullYear(),value.getMonth(),value.getDate());const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value||''));return match?new Date(Number(match[1]),Number(match[2])-1,Number(match[3])):new Date(NaN)}
function localDayNumber(d){return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000}
function fmtDateShort(d){return (d.getMonth()+1)+'.'+d.getDate()}
function getMonday(d){const x=parseLocalDate(d);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x}
function getWeekKey(d){const monday=getMonday(d);const thursday=addDays(monday,3);const isoYear=thursday.getFullYear();const jan4=new Date(isoYear,0,4);const firstMonday=getMonday(jan4);const week=1+Math.round((localDayNumber(monday)-localDayNumber(firstMonday))/7);return isoYear+'-W'+String(week).padStart(2,'0')}
function normalizeWeekKey(key,weekStart){const source=weekStart&&parseLocalDate(weekStart);if(source&&!Number.isNaN(source.getTime()))return getWeekKey(source);const match=/^(\d{4})-W(\d{1,2})$/.exec(String(key||''));return match?match[1]+'-W'+String(Number(match[2])).padStart(2,'0'):String(key||'')}
function weekMatches(week,key){return normalizeWeekKey(week.weekKey,week.weekStart)===normalizeWeekKey(key)}
function addDays(d,n){const x=parseLocalDate(d);x.setDate(x.getDate()+n);return x}
function daysUntil(dateStr){const today=parseLocalDate(new Date());const target=parseLocalDate(dateStr);return Number.isNaN(target.getTime())?NaN:localDayNumber(target)-localDayNumber(today)}
function getCountdown(dateStr){
  const d=daysUntil(dateStr);
  if(d<0)return{text:'已逾期'+Math.abs(d)+'天',overdue:true,urgent:false,days:d};
  if(d===0)return{text:'今天',overdue:false,urgent:true,days:0};
  if(d===1)return{text:'明天',overdue:false,urgent:true,days:1};
  if(d<=7)return{text:d+'天后',overdue:false,urgent:true,days:d};
  if(d<=30)return{text:d+'天后',overdue:false,urgent:false,days:d};
  if(d<=365)return{text:Math.floor(d/30)+'个月',overdue:false,urgent:false,days:d};
  return{text:Math.floor(d/365)+'年',overdue:false,urgent:false,days:d};
}
function getDailyQuote(){const now=new Date();const day=localDayNumber(parseLocalDate(now))-localDayNumber(new Date(now.getFullYear(),0,1))+1;return QUOTES[day%QUOTES.length]}
function isDesktop(){return window.innerWidth>768}
function escapeHtml(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ========== PIN Gate ========== */
let pinInput='';
let pinMode='verify'; // 'verify' | 'set' | 'confirm'
let pinFirstSet='';

function hashPin(pin){return btoa(pin+'wb_plan_salt')}

function hasPin(){return !!localStorage.getItem(KEYS.pin)}

function showPinGate(mode){
  pinMode=mode||'verify';
  pinInput='';
  pinFirstSet='';
  updatePinDots();
  const sub=document.getElementById('pin-sub');
  const hint=document.getElementById('pin-hint');
  const cancelBtn=document.getElementById('pin-cancel');
  if(pinMode==='set'){
    sub.textContent='请设置4位PIN码';
    hint.textContent='设置后，每次打开需输入PIN码';
    cancelBtn.textContent='跳过';
  }else if(pinMode==='confirm'){
    sub.textContent='请再次输入PIN码确认';
    hint.textContent='';
    cancelBtn.textContent='取消';
  }else{
    sub.textContent='请输入PIN码';
    hint.textContent='';
    cancelBtn.textContent='退出';
  }
  document.getElementById('pin-error').classList.remove('show');
  document.getElementById('pin-gate').classList.add('show');
  document.getElementById('app').inert=true;
  document.body.classList.add('overlay-open');
  setTimeout(()=>document.querySelector('#pin-keypad .pin-key')?.focus(),0);
}

function hidePinGate(){document.getElementById('pin-gate').classList.remove('show');document.getElementById('app').inert=false;if(!document.getElementById('modal-root').classList.contains('show'))document.body.classList.remove('overlay-open')}

function updatePinDots(){
  const dots=document.querySelectorAll('#pin-dots .pin-dot');
  dots.forEach((d,i)=>{
    d.classList.toggle('filled',i<pinInput.length);
  });
}

function handlePinKey(key){
  if(key==='back'){
    pinInput=pinInput.slice(0,-1);
  }else if(key==='cancel'){
    if(pinMode==='set'){
      hidePinGate();
      initApp();
    }else{
      pinInput='';
      updatePinDots();
    }
    return;
  }else{
    if(pinInput.length<4)pinInput+=key;
  }
  updatePinDots();
  if(pinInput.length===4){
    setTimeout(handlePinComplete,200);
  }
}

function handlePinComplete(){
  if(pinMode==='set'){
    pinFirstSet=pinInput;
    pinMode='confirm';
    pinInput='';
    updatePinDots();
    document.getElementById('pin-sub').textContent='请再次输入PIN码确认';
  }else if(pinMode==='confirm'){
    if(pinInput===pinFirstSet){
      localStorage.setItem(KEYS.pin,hashPin(pinInput));
      hidePinGate();
      showToast('PIN码设置成功','success');
      initApp();
    }else{
      document.getElementById('pin-error').textContent='两次输入不一致，请重新设置';
      document.getElementById('pin-error').classList.add('show');
      pinMode='set';
      pinInput='';
      pinFirstSet='';
      updatePinDots();
      document.getElementById('pin-sub').textContent='请设置4位PIN码';
    }
  }else{
    // verify
    if(hashPin(pinInput)===localStorage.getItem(KEYS.pin)){
      hidePinGate();
      initApp();
    }else{
      document.getElementById('pin-error').textContent='PIN码错误，请重试';
      document.getElementById('pin-error').classList.add('show');
      pinInput='';
      updatePinDots();
    }
  }
}

function saveSyncConfig(){
  const owner=document.getElementById('sc-owner').value.trim();
  const repo=document.getElementById('sc-repo').value.trim();
  const token=document.getElementById('sc-token').value.trim();
  const room=document.getElementById('sc-room').value.trim().toUpperCase();
  const secret=document.getElementById('sc-secret').value;
  if(!owner){showToast('请填写 GitHub 用户名','error');return}
  if(!repo){showToast('请填写仓库名','error');return}
  if(!token){showToast('请填写 Personal Token','error');return}
  if(token.length<20){showToast('Token 不完整（需约40字符），请复制完整 token','error');return}
  if(!room||room.length<4){showToast('请填写房间码（至少4位）','error');return}
  if(!CloudSync.hasSecret()&&(!secret||secret.length<6)){showToast('请设置同步密码（至少6位）','error');return}
  CloudSync.config.owner=owner;
  CloudSync.config.repo=repo;
  CloudSync.config.token=token;
  CloudSync.config.roomId=room;
  CloudSync.config.enabled=true;
  if(secret){CloudSync.setSecret(secret);CloudSync.meta.salt=null;CloudSync.meta.version=0;CloudSync.meta.sha=null;CloudSync.saveMeta()}
  CloudSync.saveConfig();
  hideModal();
  showToast('云同步已启用，正在连接…','success');
  CloudSync.init();
}

/* ========== Store ========== */
const DATA_KEYS=['monthly','weekly','cases','strategy','inspirations','settings'];
function isPlainObject(value){return !!value&&typeof value==='object'&&!Array.isArray(value)}
function isValidLocalDateString(value){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(value||'')))return false;
  const date=parseLocalDate(value);
  return !Number.isNaN(date.getTime())&&fmtDate(date)===value;
}
function validateModule(name,value){
  if(name==='monthly')return isPlainObject(value)&&Array.isArray(value.boards);
  if(name==='weekly')return Array.isArray(value)&&value.every(week=>isPlainObject(week)&&isValidLocalDateString(week.weekStart)&&Array.isArray(week.tasks)&&week.tasks.every(task=>isPlainObject(task)&&Number.isInteger(Number(task.day))&&Number(task.day)>=1&&Number(task.day)<=7));
  if(name==='cases')return isPlainObject(value)&&Array.isArray(value.cases)&&value.cases.every(item=>isPlainObject(item)&&isValidLocalDateString(item.date));
  if(name==='strategy')return isPlainObject(value)&&Array.isArray(value.goals)&&Array.isArray(value.fixedActions)&&Array.isArray(value.topics);
  if(name==='inspirations')return Array.isArray(value)&&value.every(i=>isPlainObject(i));
  if(name==='settings')return isPlainObject(value);
  return false;
}
function validateData(data){
  if(!isPlainObject(data)||!validateModule('monthly',data.monthly)||!validateModule('weekly',data.weekly)||!validateModule('cases',data.cases)||!validateModule('strategy',data.strategy))throw new Error('备份缺少完整且有效的计划数据');
  if(data.settings!==undefined&&!validateModule('settings',data.settings))throw new Error('设置数据格式不正确');
  if(data.inspirations!==undefined&&!validateModule('inspirations',data.inspirations))throw new Error('灵感池数据格式不正确');
  return true;
}
function cloneData(data){return JSON.parse(JSON.stringify(data))}
const Store={
  get(key,def){
    try{
      const raw=localStorage.getItem(key);
      if(raw===null||raw===undefined)return def;
      return JSON.parse(raw);
    }catch(e){
      console.error('Store.get error:',key,e);
      return def;
    }
  },
  readBackup(){
    try{const data=JSON.parse(localStorage.getItem(KEYS.backup)||'null');return data&&data.format===BACKUP_FORMAT&&data.version===BACKUP_VERSION&&Array.isArray(data.snapshots)?data:{format:BACKUP_FORMAT,version:BACKUP_VERSION,snapshots:[]}}catch(e){return{format:BACKUP_FORMAT,version:BACKUP_VERSION,snapshots:[]}}
  },
  snapshot(data){return{format:BACKUP_FORMAT,version:BACKUP_VERSION,createdAt:new Date().toISOString(),data:cloneData(data)}},
  saveSnapshot(data){
    const backup=this.readBackup();
    backup.snapshots.push(this.snapshot(data));
    backup.snapshots=backup.snapshots.slice(-MAX_BACKUP_SNAPSHOTS);
    localStorage.setItem(KEYS.backup,JSON.stringify(backup));
  },
  currentData(){return{monthly:this.get(KEYS.monthly,{boards:[]}),weekly:this.get(KEYS.weekly,[]),cases:this.get(KEYS.cases,{cases:[]}),strategy:this.get(KEYS.strategy,{goals:[],fixedActions:[],topics:[]}),inspirations:this.get(KEYS.inspirations,[]),settings:this.get(KEYS.settings,{lastBackupReminder:0,lastExport:0})}},
  set(key,val){
    try{
      const str=JSON.stringify(val);
      localStorage.setItem(key,str);
      if(key!==KEYS.backup&&key!==KEYS.init){try{this.saveSnapshot(this.currentData())}catch(e){console.warn('Backup snapshot failed',e)}}
      if(key!==KEYS.backup&&key!==KEYS.init&&typeof CloudSync!=='undefined'){CloudSync.push()}
      return true;
    }catch(e){
      if(e.name==='QuotaExceededError'){
        showToast('存储空间已满，请导出备份后清理旧数据','error');
      }else{
        showToast('数据保存失败：'+e.message,'error');
      }
      return false;
    }
  },
  remove(key){try{localStorage.removeItem(key)}catch(e){}},
  checkCorruption(){
    const corrupted=[];
    const modules=[[KEYS.monthly,'monthly'],[KEYS.weekly,'weekly'],[KEYS.cases,'cases'],[KEYS.strategy,'strategy']];
    modules.forEach(([key,name])=>{
      const raw=localStorage.getItem(key);
      if(raw){
        try{if(!validateModule(name,JSON.parse(raw)))corrupted.push(key)}catch(e){corrupted.push(key)}
      }
    });
    return corrupted;
  },
  getRecovery(keys){
    const snapshots=this.readBackup().snapshots.slice().reverse();
    return snapshots.find(s=>{try{validateData(s.data);return keys.every(key=>Object.prototype.hasOwnProperty.call(s.data,key.replace(PREFIX,'')))}catch(e){return false}})||null;
  },
  commitImport(data){
    validateData(data);
    const candidate=cloneData(data);
    candidate.settings=isPlainObject(candidate.settings)?candidate.settings:{lastBackupReminder:0,lastExport:0};
    const previous={};const writes=[];const previousInit=localStorage.getItem(KEYS.init);
    DATA_KEYS.forEach(name=>{const key=KEYS[name];previous[key]=localStorage.getItem(key);writes.push([key,JSON.stringify(candidate[name])])});
    try{writes.forEach(([key,value])=>localStorage.setItem(key,value));localStorage.setItem(KEYS.init,'1');this.saveSnapshot(candidate);return true}
    catch(error){writes.forEach(([key])=>{try{if(previous[key]===null)localStorage.removeItem(key);else localStorage.setItem(key,previous[key])}catch(e){}});try{if(previousInit===null)localStorage.removeItem(KEYS.init);else localStorage.setItem(KEYS.init,previousInit)}catch(e){}throw error}
  }
};

/* ========== Cloud Sync (GitHub 仓库 + 轮询 + 客户端加密, 长期免费) ========== */
const SYNC_KEY_CONFIG=PREFIX+'sync_config';
const SYNC_KEY_META=PREFIX+'sync_meta';
const SYNC_KEY_SECRET=PREFIX+'sync_secret';
const SYNC_KEY_DEVICE=PREFIX+'device_id';
const SYNC_DEBOUNCE=900;
const SYNC_POLL_INTERVAL=12000;
const SYNC_API='https://api.github.com';
function b64(buf){const bytes=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s)}
function unb64(str){const s=atob(str);const bytes=new Uint8Array(s.length);for(let i=0;i<s.length;i++)bytes[i]=s.charCodeAt(i);return bytes}
async function deriveSyncKey(password,saltB64){
  const enc=new TextEncoder();
  const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(saltB64),iterations:120000,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function syncEncrypt(key,plaintext){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(plaintext));return{iv:b64(iv),ct:b64(ct)}}
async function syncDecrypt(key,ivB64,ctB64){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(ivB64)},key,unb64(ctB64));return new TextDecoder().decode(pt)}
const SYNC_LABELS={local:'仅本地',connecting:'连接中',online:'已同步',syncing:'同步中',synced:'已保存',updated:'已更新',error:'同步失败'};
const CloudSync={
  cryptoKey:null,pollTimer:null,
  isPushing:false,applyingRemote:false,pendingVersion:0,localVersion:0,pushTimer:null,statusTimer:null,
  status:'local',
  config:{owner:'',repo:'',token:'',branch:'main',roomId:'',enabled:false},
  meta:{version:0,sha:null,salt:null},
  deviceId:'',
  loadConfig(){
    const def={owner:'',repo:'',token:'',branch:'main',roomId:'',enabled:false};
    try{this.config=Object.assign(def,JSON.parse(localStorage.getItem(SYNC_KEY_CONFIG)||'null')||{})}catch(e){this.config=def}
    const mdef={version:0,sha:null,salt:null};
    try{this.meta=Object.assign(mdef,JSON.parse(localStorage.getItem(SYNC_KEY_META)||'null')||{})}catch(e){this.meta=mdef}
    this.deviceId=localStorage.getItem(SYNC_KEY_DEVICE);
    if(!this.deviceId){this.deviceId=uid();localStorage.setItem(SYNC_KEY_DEVICE,this.deviceId)}
  },
  saveConfig(){localStorage.setItem(SYNC_KEY_CONFIG,JSON.stringify(this.config))},
  saveMeta(){localStorage.setItem(SYNC_KEY_META,JSON.stringify(this.meta))},
  hasSecret(){return !!localStorage.getItem(SYNC_KEY_SECRET)},
  setSecret(v){if(v)localStorage.setItem(SYNC_KEY_SECRET,v);else localStorage.removeItem(SYNC_KEY_SECRET)},
  ensureSalt(){if(!this.meta.salt){this.meta.salt=b64(crypto.getRandomValues(new Uint8Array(16)));this.saveMeta()}},
  setStatus(s,label){
    this.status=s;
    const el=document.getElementById('sync-indicator');
    if(!el)return;
    el.className='sync-indicator sync-'+s;
    const lbl=el.querySelector('.sync-label');
    if(lbl)lbl.textContent=label||SYNC_LABELS[s]||s;
    if(this.statusTimer){clearTimeout(this.statusTimer);this.statusTimer=null}
    if(s==='synced'||s==='updated')this.statusTimer=setTimeout(()=>{if(this.status==='synced'||this.status==='updated')this.setStatus('online')},2200);
  },
  filePath(){return 'plan_sync/'+this.config.roomId+'.json'},
  apiUrl(){return SYNC_API+'/repos/'+this.config.owner+'/'+this.config.repo+'/contents/'+this.filePath()+'?ref='+encodeURIComponent(this.config.branch||'main')},
  headers(){return {'Authorization':'Bearer '+this.config.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}},
  async init(){
    this.loadConfig();
    this.stopPoll();
    if(!this.config.enabled||!this.config.owner||!this.config.repo||!this.config.token||!this.config.roomId||!this.hasSecret()){this.setStatus('local');return}
    this.setStatus('connecting');
    try{
      this.ensureSalt();
      this.cryptoKey=await deriveSyncKey(localStorage.getItem(SYNC_KEY_SECRET),this.meta.salt);
      await this.poll(true);
      this.startPoll();
    }catch(e){
      console.error('CloudSync init error',e);
      this.setStatus('error');
      showToast('云同步连接失败：'+(e.message||e),'error');
    }
  },
  startPoll(){this.stopPoll();this.pollTimer=setInterval(()=>this.poll(),SYNC_POLL_INTERVAL)},
  stopPoll(){if(this.pollTimer){clearInterval(this.pollTimer);this.pollTimer=null}},
  async poll(isInitial){
    if(this.isPushing)return;
    try{
      const r=await fetch(this.apiUrl(),{headers:this.headers()});
      if(r.status===404){if(localStorage.getItem(KEYS.init)&&!this.meta.sha)this.push(true);if(this.status==='connecting')this.setStatus('online');return}
      if(!r.ok)throw new Error('HTTP '+r.status);
      const data=await r.json();
      const sha=data.sha;
      if(sha===this.meta.sha){if(this.status==='connecting')this.setStatus('online');return}
      this.meta.sha=sha;this.saveMeta();
      const content=atob((data.content||'').replace(/\n/g,''));
      if(!content){if(this.status==='connecting')this.setStatus('online');return}
      const payload=JSON.parse(content);
      if(this.isPushing&&payload.updatedAtBy===this.deviceId&&payload.version===this.pendingVersion){this.localVersion=payload.version;this.isPushing=false;this.setStatus('synced');return}
      if(payload.version<=this.localVersion){if(this.status==='connecting')this.setStatus('online');return}
      this.localVersion=payload.version;
      try{
        await this.applyPayload(payload);
        this.setStatus('updated');
        if(!isInitial)showToast('已同步其他设备的更新','success');
        else if(this.status==='connecting')this.setStatus('online');
      }catch(e){console.error('apply remote error',e);this.setStatus('error');showToast('同步数据解密失败：各端同步密码需一致','error')}
    }catch(e){console.error('poll error',e);if(this.status!=='syncing')this.setStatus('error')}
  },
  async applyPayload(payload){
    const salt=payload.salt;
    if(salt&&salt!==this.meta.salt){this.meta.salt=salt;this.saveMeta();this.cryptoKey=await deriveSyncKey(localStorage.getItem(SYNC_KEY_SECRET),this.meta.salt)}
    const plaintext=await syncDecrypt(this.cryptoKey,payload.iv,payload.ct);
    const data=JSON.parse(plaintext);
    validateData(data);
    this.applyRemote(data);
  },
  applyRemote(data){
    this.applyingRemote=true;
    try{Store.set(KEYS.monthly,data.monthly);Store.set(KEYS.weekly,data.weekly);Store.set(KEYS.cases,data.cases);Store.set(KEYS.strategy,data.strategy);if(data.inspirations)Store.set(KEYS.inspirations,data.inspirations);if(data.settings)Store.set(KEYS.settings,data.settings)}
    finally{this.applyingRemote=false}
    loadState();renderAll();
  },
  push(immediate){
    if(this.applyingRemote||!this.config.enabled||!this.cryptoKey)return;
    if(this.pushTimer){clearTimeout(this.pushTimer);this.pushTimer=null}
    if(immediate)this._doPush();else this.pushTimer=setTimeout(()=>this._doPush(),SYNC_DEBOUNCE);
  },
  async _doPush(){
    if(!this.cryptoKey)return;
    this.isPushing=true;this.pendingVersion=this.localVersion+1;this.setStatus('syncing');
    try{
      this.ensureSalt();
      let enc=await syncEncrypt(this.cryptoKey,JSON.stringify(Store.currentData()));
      let payload={salt:this.meta.salt,iv:enc.iv,ct:enc.ct,version:this.pendingVersion,updatedAtTs:Date.now(),updatedAtBy:this.deviceId};
      let contentB64=btoa(JSON.stringify(payload));
      let sha=this.meta.sha;
      if(!sha){try{const g=await fetch(this.apiUrl(),{headers:this.headers()});if(g.ok){const gd=await g.json();sha=gd.sha;this.meta.sha=sha;this.saveMeta()}}catch(e){}}
      const body={message:'plan-sync v'+this.pendingVersion,content:contentB64};
      if(sha)body.sha=sha;
      let r=await fetch(this.apiUrl(),{method:'PUT',headers:this.headers(),body:JSON.stringify(body)});
      if(r.status===409||r.status===422){
        // sha 过期：拉最新应用，再用新 sha + 新 version 重推
        const g=await fetch(this.apiUrl(),{headers:this.headers()});
        if(g.ok){const gd=await g.json();this.meta.sha=gd.sha;this.saveMeta();const pc=JSON.parse(atob((gd.content||'').replace(/\n/g,'')));if(pc.version>this.localVersion){this.localVersion=pc.version;if(pc.salt&&pc.salt!==this.meta.salt){this.meta.salt=pc.salt;this.saveMeta();this.cryptoKey=await deriveSyncKey(localStorage.getItem(SYNC_KEY_SECRET),this.meta.salt)}try{await this.applyPayload(pc)}catch(e){}}}
        this.pendingVersion=this.localVersion+1;
        enc=await syncEncrypt(this.cryptoKey,JSON.stringify(Store.currentData()));
        payload={salt:this.meta.salt,iv:enc.iv,ct:enc.ct,version:this.pendingVersion,updatedAtTs:Date.now(),updatedAtBy:this.deviceId};
        body.content=btoa(JSON.stringify(payload));body.sha=this.meta.sha;body.message='plan-sync v'+this.pendingVersion;
        r=await fetch(this.apiUrl(),{method:'PUT',headers:this.headers(),body:JSON.stringify(body)});
      }
      if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error('PUT '+r.status+' '+(err.message||''))}
      const rd=await r.json();
      if(rd.content&&rd.content.sha){this.meta.sha=rd.content.sha;this.saveMeta()}
      this.localVersion=this.pendingVersion;this.saveMeta();
      this.setStatus('synced');
    }catch(e){console.error('push error',e);this.isPushing=false;this.setStatus('error');showToast('同步上传失败：'+(e.message||e),'error')}
  },
  disconnect(){this.stopPoll();this.cryptoKey=null;this.setStatus('local')}
};
function applySyncUrlParams(){try{const p=new URLSearchParams(location.search);const o=p.get('sync_owner'),r=p.get('sync_repo'),t=p.get('sync_token'),m=p.get('sync_room');if(o||r||t||m){CloudSync.loadConfig();if(o)CloudSync.config.owner=o;if(r)CloudSync.config.repo=r;if(t&&t.length>=20)CloudSync.config.token=t;if(m)CloudSync.config.roomId=m.toUpperCase();CloudSync.saveConfig();history.replaceState(null,'',location.pathname)}}catch(e){}}

  // Check corruption
  const corrupted=Store.checkCorruption();
  if(corrupted.length>0){
    showCorruptionModal(corrupted);
    return;
  }
  
  // First time init
  if(!localStorage.getItem(KEYS.init)){
    const demo=generateDemoData();
    Store.set(KEYS.monthly,demo.monthly);
    Store.set(KEYS.weekly,demo.weekly);
    Store.set(KEYS.cases,demo.cases);
    Store.set(KEYS.strategy,demo.strategy);
    Store.set(KEYS.settings,{lastBackupReminder:0,lastExport:0});

  loadState();
  applySyncUrlParams();
  CloudSync.init();
  renderNav();
  renderTopbar();
  renderLegend();
  renderQuote();
  renderAll();
  checkBackupReminder();
}

/* ========== Today Module ========== */
function renderToday(){
  const now=new Date();
  const todayDayNum=now.getDay()||7;
  const todayKey=getWeekKey(now);
  
  // Collect all tasks
  const overdueItems=[];
  
  state.weekly.forEach(week=>{
    const weekMonday=getMonday(parseLocalDate(week.weekStart));
    const isCurrentWeek=weekMatches(week,todayKey);
    
    week.tasks.forEach(task=>{
      if(task.done)return;
      
      const taskDate=addDays(weekMonday,task.day-1);
      const diff=daysUntil(fmtDate(taskDate));
      const typeInfo=TASK_TYPES[task.type]||TASK_TYPES.work;
      
      const item={
        text:task.text,
        type:task.type,
        typeLabel:typeInfo.label,
        typeColor:typeInfo.color,
        weekKey:week.weekKey,
        taskId:task.id,
        day:task.day,
        dateStr:fmtDateShort(taskDate),
        diff:diff
      };
      
      if(diff<0){
        overdueItems.push(item);
      }
    });
  });
  
  // Sort
  overdueItems.sort((a,b)=>a.diff-b.diff);
  
  // Stats
  const currentWeek=state.weekly.find(w=>weekMatches(w,todayKey));
  const weekTasks=currentWeek?currentWeek.tasks:[];
  const weekDone=weekTasks.filter(t=>t.done).length;
  const weekTotal=weekTasks.length;
  const weekRate=weekTotal>0?Math.round(weekDone/weekTotal*100):0;
  
  // Monthly progress
  let monthlyDone=0,monthlyTotal=0;
  state.monthly.boards.forEach(b=>{
    b.goals.forEach(g=>{
      monthlyTotal++;
      if(g.type==='bool'&&g.done)monthlyDone++;
      else if(g.type==='count'&&g.current>=g.target)monthlyDone++;
    });
  });
  
  let html='';
  
  // Section header
  html+='<div class="section-header"><div><div class="section-title">今日要处理</div><div class="section-sub">逾期 · 灵感池</div></div></div>';
  
  // Stats
  html+='<div class="today-stats">';
  html+='<div class="stat-card"><div class="stat-num">'+weekRate+'%</div><div class="stat-label">本周完成率</div></div>';
  html+='<div class="stat-card '+(overdueItems.length>0?'danger':'')+'"><div class="stat-num">'+overdueItems.length+'</div><div class="stat-label">逾期未完成</div></div>';
  html+='<div class="stat-card"><div class="stat-num">'+monthlyDone+'/'+monthlyTotal+'</div><div class="stat-label">月度目标</div></div>';
  html+='</div>';
  
  // Overdue
  if(overdueItems.length>0){
    html+='<div class="today-banner overdue-banner">';
    html+='<div class="today-banner-title">'+ICONS.alert+' 逾期未完成 <span class="count">('+overdueItems.length+'项)</span></div>';
    html+='<div class="today-list">';
    overdueItems.forEach(item=>{
      html+=renderTodayItem(item,'overdue');
    });
    html+='</div></div>';
  }
  
  // Inspiration pool (灵感池)
  html+='<div class="today-banner" style="border-color:rgba(82,183,136,.2);background:linear-gradient(135deg,rgba(82,183,136,.05),var(--bg-2))">';
  html+='<div class="today-banner-title" style="color:var(--accent)">'+ICONS.sparkles+' 灵感池 <span class="count">('+state.inspirations.length+'条)</span></div>';
  html+='<div style="font-size:12px;color:var(--text-3);margin-bottom:10px">工作中冒出的想法先存这里，不干扰当前计划，空时再评估是否排入周计划</div>';
  if(state.inspirations.length===0){
    html+='<div class="day-empty">暂无灵感，随时记录闪现的想法</div>';
  }else{
    html+='<div class="insp-list">';
    state.inspirations.forEach(ins=>{
      html+='<div class="insp-item" data-id="'+ins.id+'">'+
        '<span class="insp-text" contenteditable="true" data-id="'+ins.id+'">'+escapeHtml(ins.text)+'</span>'+
        '<span class="insp-time">'+(ins.createdAt?fmtDateShort(new Date(ins.createdAt)):'')+'</span>'+
        '<div class="insp-actions">'+
          '<button type="button" class="insp-btn" aria-label="转入本周计划" data-id="'+ins.id+'" title="转入本周计划">'+ICONS.weekly+'</button>'+
          '<button type="button" class="insp-btn del" aria-label="删除灵感" data-id="'+ins.id+'" title="删除">'+ICONS.trash+'</button>'+
        '</div>'+
      '</div>';
    });
    html+='</div>';
  }
  html+='<div class="insp-add">'+
    '<input type="text" class="insp-add-input" placeholder="记录一个灵感…" onkeydown="if(event.key===\'Enter\')addInspiration()">'+
    '<button class="btn btn-primary btn-sm" onclick="addInspiration()">记下</button>'+
  '</div>';
  html+='</div>';

  document.getElementById('view-today').innerHTML=html;
  
  // Bind quick-complete
  document.querySelectorAll('.today-quick').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.dataset.caseId){
        toggleCaseDone(el.dataset.caseId);
      }else{
        toggleTask(el.dataset.weekKey,el.dataset.taskId);
      }
    });
  });
  // Bind inspiration actions
  document.querySelectorAll('#view-today .insp-btn.del').forEach(el=>{
    el.addEventListener('click',()=>deleteInspiration(el.dataset.id));
  });
  document.querySelectorAll('#view-today .insp-btn:not(.del)').forEach(el=>{
    el.addEventListener('click',()=>inspirationToWeekly(el.dataset.id));
  });
  document.querySelectorAll('#view-today .insp-text[contenteditable]').forEach(el=>{
    let orig=el.textContent;
    el.addEventListener('blur',()=>{
      const v=el.textContent.trim();
      if(v&&v!==orig){editInspirationText(el.dataset.id,v);orig=v;}
      else if(!v){el.textContent=orig;}
    });
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur();}});
  });
}

/* ========== Inspiration Pool (灵感池) ========== */
function addInspiration(){
  const input=document.querySelector('#view-today .insp-add-input');
  if(!input)return;
  const text=input.value.trim();
  if(!text){showToast('请输入灵感内容','warning');return;}
  state.inspirations.unshift({id:uid(),text,createdAt:new Date().toISOString()});
  saveInspirations();
  renderToday();
  checkBackupReminder();
  input.value='';
}

function deleteInspiration(id){
  state.inspirations=state.inspirations.filter(i=>i.id!==id);
  saveInspirations();
  renderToday();
  showToast('已删除','success');
}

function editInspirationText(id,newText){
  const ins=state.inspirations.find(i=>i.id===id);
  if(!ins)return;
  ins.text=newText;
  saveInspirations();
}

function inspirationToWeekly(id){
  const ins=state.inspirations.find(i=>i.id===id);
  if(!ins)return;
  // Add to current week, today
  const todayKey=getWeekKey(new Date());
  let week=state.weekly.find(w=>weekMatches(w,todayKey));
  if(!week){
    const monday=getMonday(new Date());
    week={weekKey:todayKey,weekStart:fmtDate(monday),tasks:[]};
    state.weekly.push(week);
  }
  const todayDay=new Date().getDay()||7;
  week.tasks.push({id:uid(),day:todayDay,text:ins.text,type:'work',done:false,important:false,time:''});
  saveWeekly();
  // Remove from inspirations
  state.inspirations=state.inspirations.filter(i=>i.id!==id);
  saveInspirations();
  renderToday();
  renderWeekly();
  showToast('已转入本周'+DAY_NAMES[todayDay-1]+'待办','success');
}

function addGoal(boardId){
  const board=state.monthly.boards.find(b=>b.id===boardId);
  if(!board)return;
  const input=document.querySelector('#view-monthly .goal-add-input[data-board="'+boardId+'"]');
  if(!input)return;
  const text=input.value.trim();
  if(!text){showToast('请输入目标内容','warning');return;}
  board.goals.push({id:uid(),text,type:'bool',done:false});
  saveMonthly();
  renderMonthly();
  renderToday();
  checkBackupReminder();
  showToast('已添加目标','success');
}

function deleteGoal(boardId,goalId){
  const board=state.monthly.boards.find(b=>b.id===boardId);
  if(!board)return;
  board.goals=board.goals.filter(g=>g.id!==goalId);
  saveMonthly();
  renderMonthly();
  renderToday();
  showToast('已删除目标','success');
}

function toggleGoal(boardId,goalId){
  const board=state.monthly.boards.find(b=>b.id===boardId);
  if(!board)return;
  const goal=board.goals.find(g=>g.id===goalId);
  if(!goal)return;
  const wasDone=goal.type==='bool'?goal.done:(goal.current>=goal.target);
  if(goal.type==='bool'){
    goal.done=!goal.done;
  }else{
    goal.current=goal.current>=goal.target?0:goal.target;
  }
  saveMonthly();
  renderMonthly();
  renderToday();
  checkBackupReminder();
  const nowDone=goal.type==='bool'?goal.done:(goal.current>=goal.target);
  if(!wasDone&&nowDone){
    showUndoToast('目标已完成：'+goal.text,()=>{
      if(goal.type==='bool'){
        goal.done=false;
      }else{
        goal.current=0;
      }
      saveMonthly();
      renderMonthly();
      renderToday();
    });
  }
}

function updateGoalCount(boardId,goalId,delta){
  const board=state.monthly.boards.find(b=>b.id===boardId);
  if(!board)return;
  const goal=board.goals.find(g=>g.id===goalId);
  if(!goal||goal.type!=='count')return;
  goal.current=Math.max(0,Math.min(goal.target*2,goal.current+delta));
  saveMonthly();
  renderMonthly();
  renderToday();
  checkBackupReminder();
}

function editGoalText(boardId,goalId,newText){
  const board=state.monthly.boards.find(b=>b.id===boardId);
  if(!board)return;
  const goal=board.goals.find(g=>g.id===goalId);
  if(!goal)return;
  goal.text=newText;
  saveMonthly();
  renderToday();
}

function editBoardMindset(boardId,newText){
  const board=state.monthly.boards.find(b=>b.id===boardId);
  if(!board)return;
  board.mindset=newText;
  saveMonthly();
}

function editBoardMethod(boardId,newText){
  const board=state.monthly.boards.find(b=>b.id===boardId);
  if(!board)return;
  board.method=newText;
  saveMonthly();
}

function editBoardName(boardId,newText){
  const board=state.monthly.boards.find(b=>b.id===boardId);
  if(!board)return;
  board.name=newText;
  saveMonthly();
}

function editGoalCount(boardId,goalId,field,value){
  const board=state.monthly.boards.find(b=>b.id===boardId);
  if(!board)return;
  const goal=board.goals.find(g=>g.id===goalId);
  if(!goal||goal.type!=='count')return;
  if(field==='current'){
    goal.current=Math.max(0,Math.min(value,goal.target*2));
  }else{
    goal.target=Math.max(1,value);
    goal.current=Math.min(goal.current,goal.target*2);
  }
  saveMonthly();
  renderMonthly();
  renderToday();
}

/* Goal drag & drop */
let goalDragBoardId=null,goalDragSrcId=null;
function handleGoalDragStart(e){goalDragBoardId=this.dataset.board;goalDragSrcId=this.dataset.goal;this.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function handleGoalDragEnd(e){this.classList.remove('dragging');document.querySelectorAll('#view-monthly .goal-row.drag-over').forEach(el=>el.classList.remove('drag-over'));}
function handleGoalDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';if(this.dataset.goal!==goalDragSrcId)this.classList.add('drag-over');}
function handleGoalDrop(e){
  e.preventDefault();this.classList.remove('drag-over');
  const tgtId=this.dataset.goal;
  if(!goalDragSrcId||goalDragSrcId===tgtId||this.dataset.board!==goalDragBoardId)return;
  const board=state.monthly.boards.find(b=>b.id===goalDragBoardId);
  if(!board)return;
  const src=board.goals.findIndex(g=>g.id===goalDragSrcId);
  const tgt=board.goals.findIndex(g=>g.id===tgtId);
  if(src<0||tgt<0)return;
  const [moved]=board.goals.splice(src,1);
  board.goals.splice(tgt,0,moved);
  saveMonthly();renderMonthly();renderToday();
}

/* ========== Weekly Module ========== */
function getCurrentWeekData(offset){
  const baseMonday=getMonday(new Date());
  const targetMonday=addDays(baseMonday,offset*7);
  const weekKey=getWeekKey(targetMonday);
  let week=state.weekly.find(w=>weekMatches(w,weekKey));
  if(!week){
    week={weekKey:weekKey,weekStart:fmtDate(targetMonday),tasks:[]};
  }
  return week;
}

  const weekMonday=parseLocalDate(week.weekStart);

function bindWeeklyEvents(){
  // Task checkbox toggle
  document.querySelectorAll('#view-weekly .task-check').forEach(el=>{
    el.addEventListener('click',()=>{
      const taskEl=el.closest('.task');
      toggleTask(taskEl.dataset.week,taskEl.dataset.id);
    });
  });
  
  // Task delete
  document.querySelectorAll('#view-weekly .task-del').forEach(el=>{
    el.addEventListener('click',()=>{
      const taskEl=el.closest('.task');
      deleteTask(taskEl.dataset.week,taskEl.dataset.id);
    });
  });
  
  // Task text edit (save on blur)
  document.querySelectorAll('#view-weekly .task-text[contenteditable]').forEach(el=>{
    let originalText=el.textContent;
    el.addEventListener('blur',()=>{
      const newText=el.textContent.trim();
      if(newText&&newText!==originalText){
        editTaskText(el.dataset.week,el.dataset.id,newText);
      }else if(!newText){
        el.textContent=originalText;
      }
    });
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();el.blur();}
    });
  });
  
  // Task time edit
  document.querySelectorAll('#view-weekly .task-time[contenteditable]').forEach(el=>{
    let orig=el.textContent==='--:--'?'':el.textContent;
    el.addEventListener('blur',()=>{
      const v=el.textContent.trim();
      if(v==='--:--')return;
      if(v!==orig){editTaskTime(el.dataset.week,el.dataset.id,v);orig=v||'';}
    });
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur();}});
  });
  
  // Star toggle
  document.querySelectorAll('#view-weekly .task-star').forEach(el=>{
    el.addEventListener('click',()=>{
      toggleTaskImportant(el.dataset.week,el.dataset.id);
    });
  });
  
  // Drag & drop
  document.querySelectorAll('#view-weekly .task[draggable]').forEach(el=>{
    el.addEventListener('dragstart',handleTaskDragStart);
    el.addEventListener('dragend',handleTaskDragEnd);
    el.addEventListener('dragover',handleTaskDragOver);
    el.addEventListener('drop',handleTaskDrop);
  });
  
  // Add task button
  document.querySelectorAll('#view-weekly .task-add-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const day=btn.dataset.day;
      addTaskFromButton(day);
    });
  });
}

function getSelectedType(day){
  const sel=document.querySelector('#view-weekly .type-select[data-day="'+day+'"]');
  return sel?sel.value:'work';
}

function addTaskFromInput(inputEl){
  const text=inputEl.value.trim();
  if(!text)return;
  const day=inputEl.dataset.day;
  const weekKey=inputEl.dataset.week;
  const type=getSelectedType(day);
  const timeInput=document.querySelector('.task-add-time[data-day="'+day+'"]');
  const time=timeInput?timeInput.value.trim():'';
  addTask(weekKey,parseInt(day),text,type,time);
  inputEl.value='';
  if(timeInput)timeInput.value='';
}

function addTaskFromButton(day){
  const input=document.querySelector('.task-add-input[data-day="'+day+'"]');
  if(input)addTaskFromInput(input);
}

function addTask(weekKey,day,text,type,time){
  let week=state.weekly.find(w=>weekMatches(w,weekKey));
  if(!week){
    const monday=getMonday(new Date());
    const targetMonday=addDays(monday,state.weekOffset*7);
    week={weekKey:weekKey,weekStart:fmtDate(targetMonday),tasks:[]};
    state.weekly.push(week);
  }
  week.tasks.push({id:uid(),day:day,text:text,type:type,done:false,important:false,time:time||''});
  saveWeekly();
  renderWeekly();
  renderToday();
  checkBackupReminder();
  showToast('已添加','success');
}

function toggleTask(weekKey,taskId){
  const week=state.weekly.find(w=>weekMatches(w,weekKey));
  if(!week)return;
  const task=week.tasks.find(t=>t.id===taskId);
  if(!task)return;
  const wasDone=task.done;
  task.done=!task.done;
  saveWeekly();
  renderWeekly();
  renderToday();
  if(!wasDone&&task.done){
    showUndoToast('已完成：'+task.text,()=>{
      task.done=false;
      saveWeekly();
      renderWeekly();
      renderToday();
      renderHistory();
    });
  }
}

function deleteTask(weekKey,taskId){
  const week=state.weekly.find(w=>weekMatches(w,weekKey));
  if(!week)return;
  week.tasks=week.tasks.filter(t=>t.id!==taskId);
  saveWeekly();
  renderWeekly();
  renderToday();
  showToast('已删除','success');
}

function editTaskText(weekKey,taskId,newText){
  const week=state.weekly.find(w=>weekMatches(w,weekKey));
  if(!week)return;
  const task=week.tasks.find(t=>t.id===taskId);
  if(!task)return;
  task.text=newText;
  saveWeekly();
  showToast('已保存','success');
}

function editTaskTime(weekKey,taskId,newTime){
  const week=state.weekly.find(w=>weekMatches(w,weekKey));
  if(!week)return;
  const task=week.tasks.find(t=>t.id===taskId);
  if(!task)return;
  task.time=newTime;
  saveWeekly();
  showToast('已保存','success');
}

function toggleTaskImportant(weekKey,taskId){
  const week=state.weekly.find(w=>weekMatches(w,weekKey));
  if(!week)return;
  const task=week.tasks.find(t=>t.id===taskId);
  if(!task)return;
  task.important=!task.important;
  saveWeekly();
  // Re-render without full page flicker
  const el=document.querySelector('#view-weekly .task[data-id="'+taskId+'"]');
  if(el)el.classList.toggle('task-important',task.important);
  const star=document.querySelector('#view-weekly .task-star[data-id="'+taskId+'"]');
  if(star)star.classList.toggle('active',task.important);
}

/* Drag & drop handlers */
let dragSrcTaskId=null,dragSrcWeekKey=null;
function handleTaskDragStart(e){
  const task=this.closest('.task');
  dragSrcTaskId=task.dataset.id;
  dragSrcWeekKey=task.dataset.week;
  task.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',task.dataset.id);
}
function handleTaskDragEnd(e){
  this.classList.remove('dragging');
  document.querySelectorAll('#view-weekly .task.drag-over').forEach(el=>el.classList.remove('drag-over'));
  dragSrcTaskId=null;dragSrcWeekKey=null;
}
function handleTaskDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  const task=this.closest('.task');
  if(task.dataset.id!==dragSrcTaskId){
    task.classList.add('drag-over');
  }
}
function handleTaskDrop(e){
  e.preventDefault();
  const targetTask=this.closest('.task');
  targetTask.classList.remove('drag-over');
  const targetId=targetTask.dataset.id;
  if(!dragSrcTaskId||dragSrcTaskId===targetId||dragSrcWeekKey!==targetTask.dataset.week)return;
  const week=state.weekly.find(w=>weekMatches(w,dragSrcWeekKey));
  if(!week)return;
  const srcIdx=week.tasks.findIndex(t=>t.id===dragSrcTaskId);
  const tgtIdx=week.tasks.findIndex(t=>t.id===targetId);
  if(srcIdx<0||tgtIdx<0)return;
  // Only allow same-day reorder
  if(week.tasks[srcIdx].day!==week.tasks[tgtIdx].day)return;
  const [moved]=week.tasks.splice(srcIdx,1);
  week.tasks.splice(tgtIdx,0,moved);
  saveWeekly();
  renderWeekly();
  renderToday();
}

function changeWeek(delta){
  state.weekOffset+=delta;
  renderWeekly();
}

function goToday(){
  state.weekOffset=0;
  renderWeekly();
}

/* ========== Weekly Plan Generator ========== */
function generateNextWeek(){
  const nextOffset=state.weekOffset+1;
  const baseMonday=getMonday(new Date());
  const targetMonday=addDays(baseMonday,nextOffset*7);
  const targetSunday=addDays(targetMonday,6);
  const weekKey=getWeekKey(targetMonday);
  
  // Check if next week already has tasks
  const existing=state.weekly.find(w=>weekMatches(w,weekKey));
  if(existing&&existing.tasks.length>0){
    showModal({
      title:'下周已有计划',
      body:'下周（'+fmtDateShort(targetMonday)+' - '+fmtDateShort(targetSunday)+'）已有 '+existing.tasks.length+' 条任务。是否覆盖？',
      actions:[
        {text:'取消',class:'btn-ghost',action:hideModal},
        {text:'覆盖生成',class:'btn-primary',action:()=>{
          hideModal();
          doGeneratePlan(targetMonday,weekKey,true);
        }}
      ]
    });
    return;
  }
  
  doGeneratePlan(targetMonday,weekKey,false);
}

function addCase(){

function toggleStrategyItem(type,id){

function addStrategyItem(type){

  saveStrategy();
  renderStrategy();
  checkBackupReminder();
  document.getElementById(inputId).value='';

function addTopic(){

  renderStrategy();

function editTopicText(id,newText){

  saveStrategy();
}

function cycleTopicStatus(id){
  const t=state.strategy.topics.find(t=>t.id===id);
  if(!t)return;
  const order=['idea','writing','published'];
  t.status=order[(order.indexOf(t.status)+1)%3];
  saveStrategy();
  renderStrategy();
}

function deleteTopic(id){
  state.strategy.topics=state.strategy.topics.filter(t=>t.id!==id);
  saveStrategy();
  renderStrategy();
  showToast('已删除','success');
}

function deleteStrategyItem(type,id){
  if(type==='goal'){
    state.strategy.goals=state.strategy.goals.filter(g=>g.id!==id);
  }else{
    state.strategy.fixedActions=state.strategy.fixedActions.filter(a=>a.id!==id);
  }
  saveStrategy();
  renderStrategy();
  renderToday();
  showToast('已删除','success');
}

/* Strategy drag & drop */
let stratDragType=null,stratDragId=null;
function handleStratDragStart(e){stratDragType=this.dataset.type;stratDragId=this.dataset.id;this.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function handleStratDragEnd(e){this.classList.remove('dragging');document.querySelectorAll('#view-strategy .strat-item.drag-over').forEach(el=>el.classList.remove('drag-over'));stratDragType=null;stratDragId=null;}
function handleStratDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';if(this.dataset.id!==stratDragId&&this.dataset.type===stratDragType)this.classList.add('drag-over');}
function handleStratDrop(e){
  e.preventDefault();this.classList.remove('drag-over');
  if(!stratDragId||this.dataset.id===stratDragId||this.dataset.type!==stratDragType)return;
  const list=stratDragType==='goal'?state.strategy.goals:state.strategy.fixedActions;
  const src=list.findIndex(i=>i.id===stratDragId);
  const tgt=list.findIndex(i=>i.id===this.dataset.id);
  if(src<0||tgt<0)return;
  const [moved]=list.splice(src,1);
  list.splice(tgt,0,moved);
  saveStrategy();renderStrategy();renderToday();
}

/* Topic drag & drop */
let topicDragId=null;
function handleTopicDragStart(e){topicDragId=this.dataset.id;this.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function handleTopicDragEnd(e){this.classList.remove('dragging');document.querySelectorAll('#view-strategy .topic-item.drag-over').forEach(el=>el.classList.remove('drag-over'));topicDragId=null;}
function handleTopicDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';if(this.dataset.id!==topicDragId)this.classList.add('drag-over');}
function handleTopicDrop(e){
  e.preventDefault();this.classList.remove('drag-over');
  if(!topicDragId||this.dataset.id===topicDragId)return;
  const list=state.strategy.topics;
  const src=list.findIndex(i=>i.id===topicDragId);
  const tgt=list.findIndex(i=>i.id===this.dataset.id);
  if(src<0||tgt<0)return;
  const [moved]=list.splice(src,1);
  list.splice(tgt,0,moved);
  saveStrategy();renderStrategy();
}
