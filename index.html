function bindInlineText(el,save){let orig=el.textContent;el.addEventListener('blur',()=>{const value=el.textContent.trim();if(value&&value!==orig){save(value);orig=value;}else if(!value)el.textContent=orig;});el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur();}});}
function addCaseCategory(){const input=document.getElementById('case-category-name');const name=input&&input.value.trim();if(!name)return;state.cases.categories.push({id:uid(),name,icon:'cases'});saveCases();renderCases();checkBackupReminder();showToast('已新增分类','success');}
function editCaseCategoryName(id,name){const category=state.cases.categories.find(item=>item.id===id);if(!category)return;category.name=name;saveCases();}
function confirmDeleteCaseCategory(id){const category=state.cases.categories.find(item=>item.id===id);if(!category)return;const linked=[];treeWalk(state.cases.cases,item=>{if(item.category===id)linked.push(item)});const remove=()=>{state.cases.categories=state.cases.categories.filter(item=>item.id!==id);const prune=nodes=>(nodes||[]).filter(item=>item.category!==id).map(item=>Object.assign(item,{children:prune(item.children)}));state.cases.cases=prune(state.cases.cases);saveCases();renderCases();renderToday();showToast('已删除分类','success');};if(!linked.length){remove();return;}showModal({title:'确认删除分类',body:'“'+escapeHtml(category.name)+'”含有 '+linked.length+' 个案件。删除分类会一并删除这些案件。',actions:[{text:'取消',class:'btn-ghost',action:hideModal},{text:'删除分类',class:'btn-danger',action:()=>{hideModal();remove();}}]});}

function addCase(){
  const name=document.getElementById('case-name').value.trim();
  const category=document.getElementById('case-category').value;
  const date=document.getElementById('case-date').value;
  const note=document.getElementById('case-note').value.trim();
  if(!name||!date){showToast('请填写案件名称和日期','warning');return;}
  state.cases.cases.push({id:uid(),name,category,date,time:'',note,done:false,children:[]});
  saveCases();
  renderCases();
  renderToday();
  checkBackupReminder();
  showToast('已添加案件','success');
  document.getElementById('case-name').value='';
  document.getElementById('case-date').value='';
  document.getElementById('case-note').value='';
}
function addCaseChild(parentId){const found=treeFind(state.cases.cases,parentId),text=window.prompt('添加下级案件');if(!found||!text||!text.trim())return;const parent=found.node;parent.children.push({id:uid(),name:text.trim(),category:parent.category,date:parent.date,time:'',note:'',done:false,children:[]});saveCases();renderCases();renderToday();checkBackupReminder();}

function deleteCase(id){
  const found=treeFind(state.cases.cases,id);if(!found)return;const remove=()=>{treeRemove(state.cases.cases,id);saveCases();renderCases();renderToday();showToast('已删除','success');};if(treeCount(found.node.children)){showModal({title:'确认删除案件',body:'该案件包含 '+treeCount(found.node.children)+' 个下级案件。删除后无法恢复。',actions:[{text:'取消',class:'btn-ghost',action:hideModal},{text:'删除案件',class:'btn-danger',action:()=>{hideModal();remove();}}]});return;}remove();return;
}

function editCaseName(id,newText){
  const found=treeFind(state.cases.cases,id),c=found&&found.node;
  if(!c)return;
  c.name=newText;
  saveCases();
  renderToday();
}

function editCaseNote(id,newText){
  const found=treeFind(state.cases.cases,id),c=found&&found.node;
  if(!c)return;
  c.note=newText||'';
  saveCases();
}
function editCaseDate(id,date){const found=treeFind(state.cases.cases,id),c=found&&found.node;if(!c||!isValidLocalDateString(date)){showToast('请输入有效日期','warning');renderCases();return;}c.date=date;saveCases();renderCases();renderToday();}

function toggleCaseDone(id){
  const found=treeFind(state.cases.cases,id),c=found&&found.node;
  if(!c)return;
  const wasDone=c.done;
  c.done=!c.done;
  saveCases();
  renderCases();
  renderToday();
  if(!wasDone&&c.done){
    showUndoToast('已标记完成：'+c.name,()=>{
      c.done=false;
      saveCases();
      renderCases();
      renderToday();
    });
  }
}

/* ========== Strategy Module ========== */

function getStrategyBlock(id){return state.strategy.blocks.find(block=>block.id===id)}
function syncLegacyStrategyLists(){state.strategy.goals=(getStrategyBlock('goals')||{children:[]}).children;state.strategy.fixedActions=(getStrategyBlock('fixed-actions')||{children:[]}).children;state.strategy.topics=(getStrategyBlock('topics')||{children:[]}).children;}

function addStrategyChild(blockId,parentId){const block=getStrategyBlock(blockId);let text;if(parentId)text=window.prompt('添加下级项目');else{const input=document.querySelector('.strategy-child-input[data-block="'+blockId+'"]');text=input&&input.value.trim();}if(!block||!text||!text.trim())return;const list=parentId?(treeFind(block.children,parentId)||{}).node?.children:block.children;if(!list)return;list.push(block.kind==='topic'?{id:uid(),text:text.trim(),status:'idea',important:false,children:[]}:{id:uid(),text:text.trim(),done:false,important:false,children:[]});syncLegacyStrategyLists();saveStrategy();renderStrategy();renderToday();checkBackupReminder();}
function editStrategyBlockName(id,name){const block=getStrategyBlock(id);if(!block)return;block.name=name;saveStrategy();}
function editStrategyChildText(blockId,id,text){const block=getStrategyBlock(blockId),found=block&&treeFind(block.children,id),item=found&&found.node;if(!item)return;item.text=text;saveStrategy();renderToday();}
function toggleStrategyChild(blockId,id){const block=getStrategyBlock(blockId),found=block&&treeFind(block.children,id),item=found&&found.node;if(!item||block.kind==='topic')return;item.done=!item.done;saveStrategy();renderStrategy();renderToday();}
function cycleStrategyChildStatus(blockId,id){const block=getStrategyBlock(blockId),found=block&&treeFind(block.children,id),item=found&&found.node;if(!item||block.kind!=='topic')return;const order=['idea','writing','published'];item.status=order[(order.indexOf(item.status)+1)%3];saveStrategy();renderStrategy();}
function toggleStrategyChildImportant(blockId,id){const block=getStrategyBlock(blockId),found=block&&treeFind(block.children,id),item=found&&found.node;if(!item)return;item.important=!item.important;saveStrategy();renderStrategy();}
function deleteStrategyChild(blockId,id){const block=getStrategyBlock(blockId),found=block&&treeFind(block.children,id);if(!found)return;const remove=()=>{treeRemove(block.children,id);syncLegacyStrategyLists();saveStrategy();renderStrategy();renderToday();showToast('已删除','success');};if(treeCount(found.node.children)){showModal({title:'确认删除子项',body:'该子项包含 '+treeCount(found.node.children)+' 个下级项目。删除后无法恢复。',actions:[{text:'取消',class:'btn-ghost',action:hideModal},{text:'删除子项',class:'btn-danger',action:()=>{hideModal();remove();}}]});return;}remove();}
function confirmDeleteStrategyBlock(id){const block=getStrategyBlock(id);if(!block)return;const remove=()=>{state.strategy.blocks=state.strategy.blocks.filter(item=>item.id!==id);syncLegacyStrategyLists();saveStrategy();renderStrategy();renderToday();showToast('已删除战略区块','success');};if(!block.children.length){remove();return;}showModal({title:'确认删除战略区块',body:'“'+escapeHtml(block.name)+'”包含 '+block.children.length+' 个子项。删除后这些子项将无法恢复。',actions:[{text:'取消',class:'btn-ghost',action:hideModal},{text:'删除区块',class:'btn-danger',action:()=>{hideModal();remove();}}]});}

      '<div class="hist-week-label">'+fmtDateShort(weekMonday)+' - '+fmtDateShort(addDays(weekMonday,6))+'</div>'+
      '<button class="week-nav-btn" onclick="changeHistoryWeek(1)">'+ICONS.chevronRight+'</button>'+
      '<span style="font-size:12px;color:var(--text-3)">('+(idx+1)+'/'+pastWeeks.length+')</span>'+
    '</div>';
    
    html+='<div class="hist-summary">'+
      '<div class="hist-stat"><div class="hist-stat-num" style="color:var(--accent)">'+done+'</div><div class="hist-stat-label">已完成</div></div>'+
      '<div class="hist-stat"><div class="hist-stat-num" style="color:var(--danger-l)">'+undone+'</div><div class="hist-stat-label">未完成</div></div>'+
      '<div class="hist-stat"><div class="hist-stat-num" style="color:var(--primary)">'+rate+'%</div><div class="hist-stat-label">完成率</div></div>'+
    '</div>';
    
    for(let d=1;d<=7;d++){
      const dayTasks=[];treeWalk(week.tasks,task=>{if(task.day===d)dayTasks.push(task)});
      if(dayTasks.length===0)continue;
      const dayDate=addDays(weekMonday,d-1);
      html+='<div class="hist-day-row">'+
        '<div class="hist-day-name">'+DAY_NAMES[d-1]+'<br><span style="color:var(--text-3);font-weight:400">'+fmtDateShort(dayDate)+'</span></div>'+
        '<div class="hist-day-tasks">';
      dayTasks.forEach(task=>{
        const ti=resolveTaskType(task.type);
        html+='<div class="hist-task '+(task.done?'done':'')+'">'+
          '<span class="hist-task-dot" style="background:'+ti.color+'"></span>'+
          escapeHtml(task.text)+(task.time?' <span style="color:var(--text-4)">'+task.time+'</span>':'')+
          (task.done?' <span style="color:var(--success);font-size:11px">✓</span>':' <span style="color:var(--danger-l);font-size:11px">未完成</span>')+
        '</div>';
      });
      html+='</div></div>';
    }
  }
  
  html+=collapseRegionEnd();document.getElementById('view-history').innerHTML=html;
  bindModuleSubtitles(document.getElementById('view-history'));bindCollapseControls(document.getElementById('view-history'),renderHistory);applyViewCollapse('view-history','展开或收起历史内容');
}

function changeHistoryWeek(delta){
  historyWeekOffset=Math.max(0,historyWeekOffset+delta);
  renderHistory();
}

/* ========== Undo Toast ========== */
function showUndoToast(msg,undoFn){
  const root=document.getElementById('toast-root');
  const toast=document.createElement('div');
  toast.className='toast success undo';
  toast.innerHTML='<span>'+msg+'</span><button class="toast-undo-btn">撤销</button>';
  toast.querySelector('button').addEventListener('click',()=>{
    undoFn();
    toast.remove();
  });
  root.appendChild(toast);
  setTimeout(()=>{
    if(toast.parentNode){
      toast.style.opacity='0';
      toast.style.transition='opacity .3s';
      setTimeout(()=>toast.remove(),300);
    }
  },5000);
}

/* ========== Data Backup ========== */
function getTotalCount(){
  let count=0;
  state.monthly.boards.forEach(b=>count+=treeCount(b.goals));
  state.weekly.forEach(w=>count+=treeCount(w.tasks));
  count+=treeCount(state.cases.cases);
  count+=state.strategy.blocks.reduce((sum,block)=>sum+treeCount(block.children),0);
  count+=state.inspirations.length;
  return count;
}

function checkBackupReminder(){
  const total=getTotalCount();
  const last=state.settings.lastBackupReminder||0;
  const lastExport=state.settings.lastExport||0;
  const daysSinceExport=(Date.now()-lastExport)/86400000;
  
  if(total>=20&&(total-last>=20||last===0)&&daysSinceExport>7){
    const root=document.getElementById('backup-banner-root');
    if(root){
      root.innerHTML='<div class="backup-banner">'+
        '<div class="backup-banner-text"><strong>数据已积累 '+total+' 条</strong>，建议导出备份以防丢失。</div>'+
        '<div><button class="btn btn-primary btn-sm" onclick="exportJSON()">立即导出</button> '+
        '<button class="btn btn-ghost btn-sm" onclick="dismissBackup()">稍后</button></div>'+
      '</div>';
    }
  }
}

function dismissBackup(){
  state.settings.lastBackupReminder=getTotalCount();
  saveSettings();
  document.getElementById('backup-banner-root').innerHTML='';
}

function exportJSON(){
  const data={
    format:BACKUP_FORMAT,
    version:BACKUP_VERSION,
    exportDate:new Date().toISOString(),
    monthly:state.monthly,
    weekly:state.weekly,
    cases:state.cases,
    strategy:state.strategy,
    inspirations:state.inspirations,
    settings:state.settings
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='计划平台备份_'+fmtDate(new Date())+'.json';
  a.click();
  URL.revokeObjectURL(url);
  state.settings.lastExport=Date.now();
  state.settings.lastBackupReminder=getTotalCount();
  saveSettings();
  document.getElementById('backup-banner-root').innerHTML='';
  showToast('已导出备份','success');
}

function importJSON(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const payload=JSON.parse(e.target.result);
      if(!isPlainObject(payload))throw new Error('文件不是有效的 JSON 备份');
      // Version 1 exports contain the same four data modules but no format/settings.
      if(payload.version!==1&&payload.version!==BACKUP_VERSION)throw new Error('不支持的备份版本');
      if(payload.version===BACKUP_VERSION&&payload.format!==BACKUP_FORMAT)throw new Error('备份格式标识不正确');
      const data={monthly:payload.monthly,weekly:payload.weekly,cases:payload.cases,strategy:payload.strategy,inspirations:payload.inspirations||[],settings:payload.settings||state.settings};
      Store.commitImport(data);
      loadState();
      renderAll();
      checkBackupReminder();
      showToast('导入成功，已事务恢复全部计划数据','success');
    }catch(err){
      showToast('导入失败：'+err.message,'error');
    }
  };
  reader.readAsText(file);
  event.target.value='';
}

function confirmClearAll(){
  showModal({
    title:'确认清空全部数据',
    body:'<strong style="color:var(--danger-l)">此操作将删除所有计划、任务、案件和选题数据，且不可恢复。</strong><br><br>建议先导出备份。清空后将恢复为初始示例数据。',
    actions:[
      {text:'取消',class:'btn-ghost',action:hideModal},
      {text:'先导出再清空',class:'btn-primary',action:()=>{
        exportJSON();
        setTimeout(()=>{doClearAll();},500);
      }},
      {text:'直接清空',class:'btn-danger',action:()=>{
        doClearAll();
      }}
    ]
  });
}

function doClearAll(){
  Store.remove(KEYS.monthly);
  Store.remove(KEYS.weekly);
  Store.remove(KEYS.cases);
  Store.remove(KEYS.strategy);
  Store.remove(KEYS.settings);
  Store.remove(KEYS.backup);
  Store.remove(KEYS.init);
  
  const demo=generateDemoData();
  Store.set(KEYS.monthly,demo.monthly);
  Store.set(KEYS.weekly,demo.weekly);
  Store.set(KEYS.cases,demo.cases);
  Store.set(KEYS.strategy,demo.strategy);
  Store.set(KEYS.settings,{lastBackupReminder:0,lastExport:0});
  localStorage.setItem(KEYS.init,'1');
  
  loadState();
  renderAll();
  hideModal();
  showToast('已清空并恢复示例数据','success');
}

/* ========== Corruption Recovery ========== */
function showCorruptionModal(corrupted){
  const keyNames={[KEYS.monthly]:'月度计划',[KEYS.weekly]:'每周待办',[KEYS.cases]:'案件管理',[KEYS.strategy]:'战略与选题'};
  const names=corrupted.map(k=>keyNames[k]||k).join('、');
  const canRestore=!!Store.getRecovery(corrupted);
  
  modalLastFocused=document.activeElement;
  document.getElementById('modal-root').innerHTML='<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="corruption-title" tabindex="-1">'+
    '<div class="modal-title" id="corruption-title">'+ICONS.alert+' 数据损坏警告</div>'+
    '<div class="modal-body">检测到以下数据已损坏：<strong style="color:var(--danger-l)">'+names+'</strong><br><br>'+(canRestore?'已找到包含全部模块的版本化备份，可精确恢复。':'未找到可验证的完整备份；不会猜测数据属于哪个键。')+'</div>'+
    '<div class="modal-actions">'+
      (canRestore?'<button class="btn btn-primary" onclick="recoverFromBackup()">恢复最近完整备份</button>':'')+
      '<button class="btn btn-ghost" onclick="recoverSkip()">跳过损坏部分</button>'+
      '<button class="btn btn-primary" onclick="recoverReset()">恢复示例数据</button>'+
    '</div>'+
  '</div>';
  document.getElementById('modal-root').classList.add('show');
  document.getElementById('modal-root').dataset.dismissible='false';
  document.getElementById('app').inert=true;
  document.body.classList.add('overlay-open');
  setTimeout(()=>document.querySelector('#modal-root button')?.focus(),0);
}

function recoverSkip(){
  corrupted_keys.forEach(key=>{
    Store.remove(key);
    // Load default for missing data
    if(key===KEYS.monthly)state.monthly={boards:[]};
    if(key===KEYS.weekly)state.weekly=[];
    if(key===KEYS.cases)state.cases={cases:[]};
    if(key===KEYS.strategy)state.strategy={goals:[],fixedActions:[],topics:[]};
  });
  hideModal();
  loadState();
  renderNav();renderTopbar();renderLegend();renderQuote();
  renderAll();
  showToast('已跳过损坏数据','warning');
}

function recoverFromBackup(){
  const snapshot=Store.getRecovery(corrupted_keys);
  if(!snapshot){showToast('没有可验证的完整备份','error');return;}
  try{
    Store.commitImport(snapshot.data);
    corrupted_keys=[];
    hideModal();
    loadState();renderAll();renderNav();checkBackupReminder();
    showToast('已从最近完整备份恢复','success');
  }catch(error){showToast('恢复失败：'+error.message,'error');}
}

function recoverReset(){
  Store.remove(KEYS.monthly);
  Store.remove(KEYS.weekly);
  Store.remove(KEYS.cases);
  Store.remove(KEYS.strategy);
  Store.remove(KEYS.init);
  hideModal();
  showToast('正在恢复示例数据…','success');
  setTimeout(()=>location.reload(),500);
}

/* ========== Modal ========== */
function showModal(opts){
  modalLastFocused=document.activeElement;
  const titleId='modal-title-'+Date.now();
  let html='<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="'+titleId+'" tabindex="-1">'+
    '<div class="modal-title" id="'+titleId+'">'+(opts.title||'')+'</div>'+
    '<div class="modal-body">'+(opts.body||'')+'</div>';
  if(opts.preview){
    html+='<div class="modal-preview">'+opts.preview+'</div>';
  }
  html+='<div class="modal-actions">';
  opts.actions.forEach((a,i)=>{
    html+='<button class="btn '+a.class+'" data-idx="'+i+'">'+a.text+'</button>';
  });
  html+='</div></div>';
  
  const root=document.getElementById('modal-root');
  root.innerHTML=html;
  root.dataset.dismissible=opts.dismissible===false?'false':'true';
  root.classList.add('show');
  document.getElementById('app').inert=true;
  document.body.classList.add('overlay-open');
  
  root.querySelectorAll('.modal-actions button').forEach(btn=>{
    btn.addEventListener('click',()=>opts.actions[parseInt(btn.dataset.idx)].action());
  });
  setTimeout(()=>root.querySelector('.modal-actions button:last-child, .modal-box')?.focus(),0);
}

let modalLastFocused=null;
function hideModal(){
  const root=document.getElementById('modal-root');
  root.classList.remove('show');
  root.innerHTML='';
  delete root.dataset.dismissible;
  document.getElementById('app').inert=false;
  if(!document.getElementById('pin-gate').classList.contains('show'))document.body.classList.remove('overlay-open');
  if(modalLastFocused&&typeof modalLastFocused.focus==='function')modalLastFocused.focus();
  modalLastFocused=null;
}

// Click overlay to close
document.getElementById('modal-root').addEventListener('click',e=>{
  if(e.target===e.currentTarget&&e.currentTarget.dataset.dismissible!=='false')hideModal();
});
document.addEventListener('keydown',e=>{
  const modal=document.getElementById('modal-root');
  const pin=document.getElementById('pin-gate');
  if(pin.classList.contains('show')){
    if(/^\d$/.test(e.key)){e.preventDefault();handlePinKey(e.key)}
    else if(e.key==='Backspace'){e.preventDefault();handlePinKey('back')}
    else if(e.key==='Escape'&&pinMode==='set'){e.preventDefault();handlePinKey('cancel')}
    else if(e.key==='Tab'){
      const focusable=[...pin.querySelectorAll('button:not([disabled])')];
      if(focusable.length){const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
    }
    return;
  }
  if(!modal.classList.contains('show'))return;
  if(e.key==='Escape'){e.preventDefault();if(modal.dataset.dismissible!=='false')hideModal();return;}
  if(e.key==='Tab'){
    const focusable=[...modal.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled);
    if(!focusable.length)return;
    const first=focusable[0],last=focusable[focusable.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});

/* ========== Toast ========== */
function showToast(msg,type){
  const root=document.getElementById('toast-root');
  const toast=document.createElement('div');
  toast.className='toast '+(type||'');
  toast.textContent=msg;
  root.appendChild(toast);
  setTimeout(()=>{
    toast.style.opacity='0';
    toast.style.transition='opacity .3s';
    setTimeout(()=>toast.remove(),300);
  },3000);
}

/* ========== Start ========== */
let corrupted_keys=[];
window.addEventListener('DOMContentLoaded',()=>{
  // Bind PIN keypad
  document.querySelectorAll('#pin-keypad .pin-key').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key=btn.dataset.key;
      if(key)handlePinKey(key);
      else if(btn.id==='pin-back')handlePinKey('back');
      else if(btn.id==='pin-cancel')handlePinKey('cancel');
    });
  });
  
  // Check corruption
  const corrupted=Store.checkCorruption();
  if(corrupted.length>0){
    corrupted_keys=corrupted;
    showCorruptionModal(corrupted);
    // Still init with whatever is available
    if(!localStorage.getItem(KEYS.init)){
      corrupted.forEach(k=>Store.remove(k));
    }
  }
  
  // PIN gate
  if(hasPin()){
    showPinGate('verify');
  }else{
    initApp();
  }
  // Refresh countdowns every minute
  setInterval(()=>{
    if(isDesktop()){
      renderToday();
      renderCases();
    }else{
      if(state.currentTab==='today')renderToday();
      if(state.currentTab==='cases')renderCases();
    }
  },60000);
  // Re-render on resize crossing breakpoint
  let prevDesktop=isDesktop();
  window.addEventListener('resize',()=>{
    const nowDesktop=isDesktop();
    if(nowDesktop!==prevDesktop){
      prevDesktop=nowDesktop;
      renderAll();
    }
  });
});
</script>
